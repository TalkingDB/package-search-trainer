[project]
name = "package-search-trainer"
version = "0.1.0"
description = "Generic crawl-and-train pipeline: fetches pages from configured seed URLs, chunks their content, and pushes it into package-document-search (vector/keyword index) and package-parse-tree (ontology)."
authors = [
    { name = "immkg", email = "mayank.g@smarter.codes" }
]
readme = "README.md"
requires-python = ">=3.12,<3.14"

[tool.poetry]
packages = [
    { include = "talkingdb_st" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = ">=0.125.0,<0.126.0"
uvicorn = { version = ">=0.38.0,<0.39.0", extras = ["standard"] }
requests = ">=2.32.5,<3.0.0"
httpx = ">=0.28.1,<0.29.0"
pydantic = ">=2.12.5,<3.0.0"
debugpy = ">=1.8.19,<2.0.0"
beautifulsoup4 = ">=4.13.0,<5.0.0"
lxml = ">=5.3.0,<7.0.0"

talkingdb-models = { git = "git+https://github.com/TalkingDB/base-tdb-models.git", rev = "6ad6e83c8968c718ac95c018f773dc0ba35f8cd1" }
talkingdb-clients = { git = "git+https://github.com/TalkingDB/base-tdb-clients.git", rev = "29abea220d96efac7b3ecee9deb9f5af49636174" }
talkingdb-helpers = { git = "git+https://github.com/TalkingDB/base-tdb-helpers.git", rev = "d7c891b8f2cf804aa3e8b1ffc3a4b74f2d282b11" }
package-parse-tree = { git = "git+https://github.com/TalkingDB/package-parse-tree.git", rev = "c6d38047d9ea94144d4d8d62df23ceabc17c8c24" }
package-document-search = { git = "git+https://github.com/TalkingDB/package-document-search.git", rev = "f9b77239e7b574f469c4e9028c29925ae5334261" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
pytest-cov = "^7.0"
pytest-mock = "^3.15"
anyio = "^4.14"
ruff = "^0.16.1"
responses = "^0.25.3"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.coverage.run]
source = ["talkingdb_st"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
